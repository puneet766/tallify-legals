<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tallify · Legal · Tallify</title>
  <meta name="description" content="Tallify · Legal for Tallify — the height-growth coaching app.">
  <style>
  :root {
    --bg: #06090F;
    --card: #0C1220;
    --text: #F0F4FF;
    --muted: #7A8BA8;
    --accent: #3B82F6;
    --accent-glow: #60A5FA;
    --border: rgba(59, 130, 246, 0.15);
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    font-size: 16px;
    line-height: 1.65;
    -webkit-font-smoothing: antialiased;
  }
  .page {
    max-width: 720px;
    margin: 0 auto;
    padding: 48px 20px 80px;
  }
  .brand {
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    color: var(--accent-glow);
    text-decoration: none;
    display: inline-block;
    margin-bottom: 32px;
  }
  .brand:hover { color: var(--accent); }
  h1 {
    font-size: 32px;
    line-height: 1.2;
    letter-spacing: -0.5px;
    margin: 0 0 8px;
  }
  h2 {
    font-size: 22px;
    line-height: 1.3;
    letter-spacing: -0.3px;
    margin: 40px 0 12px;
    color: var(--text);
  }
  h3 {
    font-size: 17px;
    line-height: 1.35;
    margin: 28px 0 8px;
    color: var(--text);
  }
  p, ul, ol { margin: 0 0 16px; color: var(--text); }
  ul, ol { padding-left: 22px; }
  li { margin: 6px 0; }
  strong { color: var(--text); }
  a { color: var(--accent-glow); }
  a:hover { color: var(--accent); }
  hr {
    border: 0;
    border-top: 1px solid var(--border);
    margin: 36px 0;
  }
  blockquote {
    margin: 16px 0;
    padding: 12px 16px;
    border-left: 3px solid var(--accent);
    background: rgba(59, 130, 246, 0.06);
    color: var(--muted);
  }
  table {
    width: 100%;
    border-collapse: collapse;
    margin: 16px 0;
    font-size: 14px;
  }
  th, td {
    text-align: left;
    padding: 10px 12px;
    border-bottom: 1px solid var(--border);
    vertical-align: top;
  }
  th {
    color: var(--muted);
    font-weight: 600;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  code {
    font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Monaco, Consolas, monospace;
    font-size: 0.9em;
    background: rgba(59, 130, 246, 0.10);
    padding: 2px 6px;
    border-radius: 4px;
  }
  pre {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px 16px;
    overflow-x: auto;
    font-size: 13px;
  }
  pre code { background: transparent; padding: 0; }
  .footer {
    margin-top: 60px;
    padding-top: 24px;
    border-top: 1px solid var(--border);
    color: var(--muted);
    font-size: 13px;
  }
  .footer a { color: var(--muted); text-decoration: underline; }
  @media (max-width: 480px) {
    .page { padding: 32px 16px 60px; }
    h1 { font-size: 26px; }
    h2 { font-size: 19px; }
    h3 { font-size: 16px; }
  }
</style>
</head>
<body>
  <div class="page">
    <a class="brand" href="/tallify-legals/">Tallify</a>
    
    <h1>Tallify · Legal</h1>
    <p>Public-facing policy documents for the Tallify mobile app.</p>
    <ul>
      <li><a href="/tallify-legals/privacy/">Privacy Policy</a></li>
      <li><a href="/tallify-legals/terms/">Terms of Service</a></li>
      <li><a href="/tallify-legals/community-guidelines/">Community Guidelines</a></li>
    </ul>
    <p style="margin-top:32px;color:var(--muted);font-size:14px;">
      Tallify is operated by Milan Santosh Mishra, India.
      Contact: <a href="mailto:buddhabliss99@gmail.com">buddhabliss99@gmail.com</a>
    </p>
  
    
  </div>
</body>
</html>
